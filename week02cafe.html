<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-amber-50">
    <header class="bg-amber-300 text-center mb-4 p-6 relative">
        <h1 class="text-xl font-bold">AP Cafe</h1>
        <p>[ バスクチーズケーキ専門店 ]</p>
        <!-- しずくの垂れ -->
        <div class="absolute -bottom-6 left-0 w-full flex justify-around px-4">

            <div class="flex flex-col items-center">
                <div class="w-2 h-4 bg-amber-300 rounded-t-none"></div>
                <div class="w-4 h-8 bg-amber-300 rounded-b-full"></div>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-1 h-3 bg-amber-300 rounded-t-none"></div>
                <div class="w-3 h-7 bg-amber-300 rounded-b-full"></div>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-2 h-5 bg-amber-300 rounded-t-none"></div>
                <div class="w-5 h-9 bg-amber-300 rounded-b-full"></div>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-2 h-4 bg-amber-300 rounded-t-none"></div>
                <div class="w-4 h-8 bg-amber-300 rounded-b-full"></div>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-1 h-3 bg-amber-300 rounded-t-none"></div>
                <div class="w-3 h-7 bg-amber-300 rounded-b-full"></div>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-2 h-5 bg-amber-300 rounded-t-none"></div>
                <div class="w-5 h-9 bg-amber-300 rounded-b-full"></div>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-1 h-3 bg-amber-300 rounded-t-none"></div>
                <div class="w-3 h-7 bg-amber-300 rounded-b-full"></div>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-2 h-5 bg-amber-300 rounded-t-none"></div>
                <div class="w-5 h-9 bg-amber-300 rounded-b-full"></div>
            </div>
        </div>


    </header>
    <main>
        <h2 class="text-gray-600 text-lg font-semibold text-center mt-4">【 Menu 】</h2>
        <div class="flex justify-center items-center">
            <div class="bg-stone-200 m-4 p-4 rounded-sm shadow-md">
                <h3 class="text-md font-medium">Cake</h3>
                <ul class="text-gray-600 mt-1 ml-2">
                    <li>プレーン ￥820</li>
                    <li>チョコ ￥840</li>
                    <li>抹茶 ￥840</li>
                    <li>いちご ￥840</li>
                    <li>さくら ￥860<span class="text-xs text-red-400 italic ml-2 border border-red-400 px-2 py-0.5 rounded-full">New</span>
                    </li>
                </ul>
            </div>
    
            <div class="bg-stone-200 m-4 p-4 rounded-sm shadow-md">
                <h3 class="text-md font-medium">+ set drink</h3>
                <ul class="text-gray-600 mt-1 ml-2">
                    <li>紅茶 ￥300</li>
                    <li>カフェラテ ￥300</li>
                    <li>モカ ￥320</li>
                    <li>抹茶ラテ ￥320</li>
                    <li>エスプレッソ ￥300</li>
                </ul>
            </div>
        </div>
    </main>
    <footer class="bg-amber-300 text-center p-4 mt-8">
        <p class="mt-2">住所:東京都新宿区a丁目-b</p>
        <a href="#" class="text-blue-600 underline hover:text-blue-800">場所を見る</a>
        <p>電話番号:03-xxxx-yyyy</p>
    </footer>
</body> 

</html>
